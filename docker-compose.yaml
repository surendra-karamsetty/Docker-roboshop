services:
  catalogue:
    build:
      dockerfile: catalogue.Dockerfile # it move to catalogue directory 
    image: surendra3207/catalogue:1.0.0 # it will build the image like docker build -t surendra3207/catalogue:1.0.0 .
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build:
      dockerfile: user.Dockerfile
    image: surendra3207/user:1.0.0
    container_name: user
    depends_on:
    - redis
  mongodb:
    build:
      dockerfile: mongodb.Dockerfile 
    image: surendra3207/mongodb:1.0.0
    container_name: mongodb
  redis:
    build:
      dockerfile: redis.Dockerfile
    image: surendra3207/redis:1.0.0
  container_name: redis  

networks:
  default:
    driver: bridge
    name: roboshop
    external: false #if true you need to create network manually 