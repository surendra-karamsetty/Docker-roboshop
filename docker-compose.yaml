services:
  catalogue:
    build:
      context: ./catalogue
      dockerfile: catalogue.Dockerfile # it move to catalogue directory 
    image: catalogue:1.0.0 # it will build the image like docker build -t surendra3207/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  mongodb:
    build:
      context: ./mongodb
      dockerfile: mongodb.Dockerfile 
    image: mongodb:1.0.0
    container_name: mongodb

networks:
  default:
    driver: bridge
    name: roboshop
    external: false #if true you need to create network manually 